<VirtualHost *:443>
  ServerName www.cellsites.nz
  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/www.cellsites.nz.pem
  SSLCertificateKeyFile /etc/ssl/private/www.cellsites.nz.key
  Header always set Strict-Transport-Security "max-age=63072000"
  RewriteEngine On
  RewriteRule ^.*$ https://cellsites.nz%{REQUEST_URI} [R=301,QSA,L]
</VirtualHost>
